<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP Horizontal Test</title>
  <!-- GSAP & ScrollTrigger CDNs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: sans-serif;
    }
	
	
	html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  overflow-x: hidden; /* Stops horizontal browser scrollbars */
}
	
	
	
	
	
    .spacer {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
    }
    .horizontal-gallery-wrapper {
      position: relative;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      background-color: #0b0b0b;
    }
    .gallery-track {
      display: flex;
      width: 300vw;
      height: 100%;
    }
    .slide {
      position: relative;
      width: 100vw;
      height: 100vh;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      background: #333;
      border: 2px solid #444;
    }
    .slide:nth-child(2) { background: #442222; }
    .slide:nth-child(3) { background: #224422; }
  </style>
</head>
<body>

  <div class="spacer"><h1>Scroll Down to Start Slider</h1></div>

  <section class="horizontal-gallery-wrapper">
    <div class="gallery-track">
      <div class="slide">Slide 01</div>
      <div class="slide">Slide 02</div>
      <div class="slide">Slide 03</div>
    </div>
  </section>

  <div class="spacer"><h1>End of Gallery</h1></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      gsap.registerPlugin(ScrollTrigger);

      const track = document.querySelector('.gallery-track');
      const slides = gsap.utils.toArray('.slide');

      gsap.to(track, {
        xPercent: -100 * (slides.length - 1),
        ease: 'none',
        scrollTrigger: {
          trigger: '.horizontal-gallery-wrapper',
          pin: true,
          scrub: 1,
          end: () => `+=${track.offsetWidth}`
        }
      });
    });
  </script>
</body>
</html>
