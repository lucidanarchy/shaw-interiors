<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP Parallax Test</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; overflow-x: hidden; background: #0b0b0b; color: #fff; font-family: sans-serif; }

    .spacer { height: 100vh; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; background: #181818; }
    
    .composition-section {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-height: 100vh;
      padding: 4rem 8vw;
      background-color: #0b0b0b;
    }

    .image-wrapper {
      position: absolute;
      top: 10%;
      left: 5vw;
      overflow: hidden;
      width: 58%;
      height: 80vh;
    }

    .parallax-img {
      width: 100%;
      height: 140%;
      object-fit: cover;
      filter: brightness(0.75);
    }

    .overlapping-content {
      position: relative;
      z-index: 2;
      width: 450px;
      padding: 3.5rem;
      background: rgba(25, 25, 25, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
    }
  </style>
</head>
<body>

  <div class="spacer">👇 Scroll Down to See GSAP Parallax in Action 👇</div>

  <section class="composition-section">
    <div class="image-wrapper">
      <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1200" class="parallax-img" alt="Test Image">
    </div>
    
    <div class="overlapping-content">
      <span style="color: #c8b282; font-family: monospace; letter-spacing: 0.2em;">MANIFESTO</span>
      <h2 style="font-size: 2rem; margin: 1rem 0;">Spatial Elegance</h2>
      <p style="color: #aaa; line-height: 1.6;">If you scroll up and down, the background photo moves smoothly inside its wrapper, and this box slides in from the right.</p>
    </div>
  </section>

  <div class="spacer">Scroll Back Up 👆</div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      gsap.registerPlugin(ScrollTrigger);

      // Parallax Scrub
      gsap.to('.parallax-img', {
        yPercent: -20,
        ease: 'none',
        scrollTrigger: {
          trigger: '.composition-section',
          start: 'top bottom',
          end: 'bottom top',
          scrub: true,
          markers: true // Visual markers for debugging
        }
      });

      // Box Reveal
      gsap.from('.overlapping-content', {
        x: 100,
        opacity: 0,
        duration: 1.2,
        ease: 'power3.out',
        scrollTrigger: {
          trigger: '.composition-section',
          start: 'top 70%'
        }
      });
    });
  </script>
</body>
</html>
